auth {
    pam:enabled = true
    fingerprint:enabled = true
}

background {
    path = screenshot
    blur_passes = 2
}

input-field {
    size = 250, 50
    dots_size = 0.33
    placeholder_text = <i>Speak, friend, and enter.</i>
    fail_text = <i>You shall not pass!</i>
    hide_input = false
    position = 0, 200
    valign = bottom
}

# Date
label {
    text = cmd[update:18000000] echo "<b>$(date +'%A, %-d %B %Y')</b>"
    font_size = 34
    font_family = Iosevka Nerd Font Mono
    position = 0, -150
    valign = top
}

# Week
label {
    text = cmd[update:18000000] echo "<b>$(date +'Week %V')</b>"
    font_size = 24
    font_family = Iosevka Nerd Font Mono
    position = 0, -250
    valign = top
}

# Time
label {
    text = cmd[update:1000] echo "<b><big>$(date +"%H:%M:%S")</big></b>"
    font_size = 94
    font_family = Iosevka Nerd Font Mono
}

# User
label {
    text =    $USER
    font_size = 18
    font_family = Iosevka Nerd Font Mono

    position = 0, 100
    valign = bottom
}

# uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(uptime -p || $Scripts/UptimeNixOS.sh)</b>"
    font_size = 24
    font_family = Iosevka Nerd Font Mono
    halign = right
    valign = bottom
}
